<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tu Llave — Gestión de clientes</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Login -->
  <div id="login-view" class="login-wrap hidden">
    <form id="login-form" class="login-card">
      <div class="login-logo">🔑</div>
      <h1>Tu Llave Inmobiliaria</h1>
      <p class="muted">Panel de gestión de clientes y conversaciones</p>
      <input type="password" id="login-password" placeholder="Contraseña del equipo" autocomplete="current-password" required>
      <button type="submit" class="btn primary">Entrar</button>
      <p id="login-error" class="error hidden"></p>
    </form>
  </div>

  <!-- App -->
  <div id="app-view" class="app hidden">
    <header class="topbar">
      <div class="brand">🔑 <strong>Tu Llave</strong> <span class="muted">· Panel de asesores</span></div>
      <nav class="tabs">
        <button class="tab active" data-view="indicadores">Indicadores</button>
        <button class="tab" data-view="chats">Chats</button>
        <button class="tab" data-view="embudo">Embudo</button>
      </nav>
      <button id="logout-btn" class="btn ghost">Salir</button>
    </header>

    <!-- Vista: Indicadores -->
    <main id="view-indicadores" class="view">
      <section class="kpi-row" id="kpi-row"></section>
      <section class="grid-2">
        <div class="card">
          <h2>Mensajes por día <span class="muted">· últimos 14 días</span></h2>
          <div id="chart-messages" class="chart"></div>
        </div>
        <div class="card">
          <h2>Clientes por etapa</h2>
          <div id="chart-stages" class="chart"></div>
        </div>
        <div class="card">
          <h2>Por tipo de inmueble</h2>
          <div id="chart-types" class="chart"></div>
        </div>
        <div class="card">
          <h2>Actividad reciente</h2>
          <ul id="events-feed" class="events-feed"></ul>
        </div>
      </section>
    </main>

    <!-- Vista: Chats -->
    <main id="view-chats" class="view hidden">
      <div class="chats-layout">
        <aside class="chat-list-panel">
          <input type="search" id="chat-search" placeholder="Buscar por nombre o teléfono…">
          <ul id="chat-list" class="chat-list"></ul>
        </aside>
        <section class="chat-panel">
          <div id="chat-empty" class="chat-empty muted">Selecciona una conversación</div>
          <div id="chat-detail" class="hidden">
            <div class="chat-header">
              <div>
                <div id="chat-client-name" class="chat-client-name"></div>
                <div id="chat-client-phone" class="muted small"></div>
              </div>
              <div class="chat-header-actions">
                <label class="switch" title="Al pausar, el bot deja de responder a este cliente">
                  <input type="checkbox" id="bot-pause-toggle">
                  <span class="switch-label">Bot activo</span>
                </label>
                <select id="chat-stage-select" class="stage-select"></select>
                <button id="open-ficha-btn" class="btn">Ficha</button>
              </div>
            </div>
            <div id="chat-messages" class="chat-messages"></div>
          </div>
        </section>
      </div>
    </main>

    <!-- Vista: Embudo -->
    <main id="view-embudo" class="view hidden">
      <div id="kanban" class="kanban"></div>
    </main>
  </div>

  <!-- Ficha de cliente (panel lateral) -->
  <div id="ficha-overlay" class="ficha-overlay hidden">
    <div class="ficha">
      <div class="ficha-header">
        <h2>Ficha del cliente</h2>
        <button id="ficha-close" class="btn ghost">✕</button>
      </div>
      <form id="ficha-form" class="ficha-form">
        <label>Nombre <input name="name"></label>
        <label>Teléfono <input name="phone" disabled></label>
        <label>Etapa
          <select name="stage"></select>
        </label>
        <div class="ficha-grid">
          <label>Operación
            <select name="operation">
              <option value="">—</option>
              <option value="venta">Venta</option>
              <option value="arriendo">Arriendo</option>
            </select>
          </label>
          <label>Tipo de inmueble
            <select name="property_type">
              <option value="">—</option>
              <option value="apartamento">Apartamento</option>
              <option value="apartaestudio">Apartaestudio</option>
              <option value="casa">Casa</option>
              <option value="lote">Lote</option>
              <option value="bodega">Bodega</option>
              <option value="oficina">Oficina</option>
            </select>
          </label>
          <label>Zona <input name="zone"></label>
          <label>Fuente <input name="source" placeholder="¿Cómo nos conoció?"></label>
          <label>Presupuesto mín. <input name="budget_min" type="number" min="0"></label>
          <label>Presupuesto máx. <input name="budget_max" type="number" min="0"></label>
          <label>Forma de pago
            <select name="payment_method">
              <option value="">—</option>
              <option value="credito">Crédito hipotecario</option>
              <option value="leasing">Leasing</option>
              <option value="recursos_propios">Recursos propios</option>
              <option value="subsidio">Subsidio</option>
            </select>
          </label>
          <label>Crédito preaprobado
            <select name="credit_preapproved">
              <option value="">—</option>
              <option value="true">Sí</option>
              <option value="false">No</option>
            </select>
          </label>
          <label>Urgencia
            <select name="urgency">
              <option value="">—</option>
              <option value="inmediata">Inmediata</option>
              <option value="1_3_meses">1–3 meses</option>
              <option value="3_6_meses">3–6 meses</option>
              <option value="explorando">Explorando</option>
            </select>
          </label>
          <label>Motivo
            <select name="purpose">
              <option value="">—</option>
              <option value="vivienda">Vivienda propia</option>
              <option value="inversion">Inversión</option>
            </select>
          </label>
          <label>Situación actual <input name="current_situation" placeholder="arrienda / propietario…"></label>
          <label>Contacto preferido <input name="contact_pref" placeholder="horario / medio"></label>
        </div>
        <label>Hogar <input name="household" placeholder="quiénes habitarían, mascotas…"></label>
        <label>Propiedades de interés (IDs) <input name="interested_property_ids" placeholder="5, 12"></label>
        <label class="check-row"><input type="checkbox" name="is_hot"> Lead caliente 🔥</label>
        <label>Notas del asesor <textarea name="notes" rows="3"></textarea></label>
        <button type="submit" class="btn primary">Guardar cambios</button>
        <p id="ficha-status" class="muted small"></p>
      </form>
      <div class="ficha-events">
        <h3>Bitácora</h3>
        <ul id="ficha-events-list" class="events-feed"></ul>
      </div>
    </div>
  </div>

  <div id="tooltip" class="tooltip hidden"></div>

  <script src="app.js"></script>
</body>
</html>
