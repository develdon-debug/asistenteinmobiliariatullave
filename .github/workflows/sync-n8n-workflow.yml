name: Sync workflow to n8n

on:
  push:
    branches:
      - main
      - claude/tullave-whatsapp-ai-agent-8br093
    paths:
      - "workflows/whatsapp-agent.json"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar workflow antes de subir
        run: python3 scripts/validate-workflow.py workflows/whatsapp-agent.json

      - name: Sync workflow to n8n
        env:
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
        run: bash scripts/sync-n8n-workflow.sh
